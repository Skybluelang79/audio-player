# Render blueprint: https://render.com/docs/blueprint-spec
#
# Creates a Postgres database plus a web service. Media (uploaded audio and
# artwork) lives on a mounted disk -- Render's container filesystem is wiped on
# every deploy, so without `disk:` every upload is lost on the next release.
#
# MEDIA_ROOT is set below to the disk's absolute mount path so uploads land on
# the persistent volume rather than the ephemeral container filesystem.

databases:
  - name: auralis-db
    databaseName: auralis
    user: auralis
    plan: basic-256mb
    postgresMajorVersion: "17"

services:
  - type: web
    name: auralis
    runtime: python
    plan: starter
    region: oregon
    branch: main

    buildCommand: >-
      pip install --no-cache-dir -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120

    # Uploaded audio can be large and slow to read from Postgres-backed storage,
    # hence the raised timeout in startCommand.
    autoDeployTrigger: commit
    healthCheckPath: /healthz/

    disk:
      name: auralis-media
      mountPath: /var/media
      sizeGB: 10

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"

      - key: DEBUG
        value: "False"

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

      # Render terminates TLS at its edge proxy and forwards X-Forwarded-Proto,
      # which settings.py already trusts via SECURE_PROXY_SSL_HEADER.
      - key: SECURE_SSL_REDIRECT
        value: "True"

      - key: SECURE_HSTS_SECONDS
        value: "31536000"

      - key: ALLOWED_HOSTS
        # Render injects the on-host hostname automatically; this covers the
        # public domain. Add your own custom domain here if you add one.
        sync: false

      - key: SECRET_KEY
        generateValue: true

      # Required: do not use the SQLite fallback in production -- Render's
      # filesystem is ephemeral, so the database would reset on every deploy.
      - key: DB_ENGINE
        value: postgres
      - key: POSTGRES_DB
        fromDatabase:
          name: auralis-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: auralis-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: auralis-db
          property: password

      - key: MEDIA_ROOT
        value: /var/media

      # Streaming auth: keep the site player public unless a signed token is
      # wanted in front of /audio/. Downloads default to authenticated-only.
      - key: STREAM_REQUIRE_AUTH
        value: "False"
      - key: DOWNLOADS_REQUIRE_AUTH
        value: "True"

      # Per-play royalty applied when staff generate artist payouts. Store as a
      # decimal string so the rate never passes through a float.
      - key: PAYOUT_RATE_PER_PLAY
        value: "0.004"

      # HLS packaging is OFF by default. Turning it on requires ffmpeg on the
      # runtime, which the built-in Python runtime does not ship; switch to a
      # custom Docker image (`raycast/render-python-ffmpeg` or similar) before
      # enabling it.
      - key: HLS_ENABLED
        value: "False"
      - key: HLS_SEGMENT_SECONDS
        value: "6"
      - key: HLS_VARIANTS
        value: "128,192"
      - key: FFMPEG_BINARY
        value: "ffmpeg"

      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
