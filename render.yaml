# Render blueprint: https://render.com/docs/blueprint-spec
# Free tier: one Free web service built from the repo Dockerfile. Free web
# services have no persistent disk, so the default SQLite database is
# ephemeral. For durable data, set DB_ENGINE=postgres and POSTGRES_* to a free
# external database (Neon/Supabase) in the Render dashboard.
services:
  - type: web
    name: auralis
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /healthz/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
