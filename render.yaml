# Render blueprint: https://render.com/docs/blueprint-spec
#
# Free-tier layout: a single free web service, with PostgreSQL and media hosted
# externally. Render's free plan has no persistent disk (disks are paid) and its
# free PostgreSQL expires after 30 days, so instead this points at:
#
#   * Neon        -- free managed PostgreSQL (set the POSTGRES_* vars)
#   * Cloudflare R2 -- free S3-compatible bucket for media (set the AWS_* vars)
#
# Both are provided through `sync: false` env vars, so Render prompts for them
# at deploy time rather than storing secrets in the repo.

services:
  - type: web
    name: auralis
    runtime: python
    plan: free
    region: oregon
    branch: main

    buildCommand: >-
      pip install --no-cache-dir -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120

    autoDeployTrigger: commit
    healthCheckPath: /healthz/

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"

      - key: DEBUG
        value: "False"

      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

      # Render terminates TLS at its edge proxy and forwards X-Forwarded-Proto,
      # which settings.py trusts via SECURE_PROXY_SSL_HEADER.
      - key: SECURE_SSL_REDIRECT
        value: "True"

      - key: SECURE_HSTS_SECONDS
        value: "31536000"

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        # Render's on-host hostname plus your *.onrender.com domain. Add a custom
        # domain here too if you attach one.
        sync: false

      # ---------------------------------------------------------------------
      # PostgreSQL (Neon). Paste the values from your Neon connection string:
      #   postgresql://USER:PASSWORD@HOST/DB?sslmode=require
      # ---------------------------------------------------------------------
      - key: DB_ENGINE
        value: postgres
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false

      # ---------------------------------------------------------------------
      # Media on Cloudflare R2 (S3-compatible). USE_S3_MEDIA turns the bucket
      # on; the rest come from your R2 bucket + API token.
      # ---------------------------------------------------------------------
      - key: USE_S3_MEDIA
        value: "True"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_S3_CUSTOM_DOMAIN
        # e.g. pub-abc123.r2.dev, or your custom media domain.
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
