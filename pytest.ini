[pytest]
DJANGO_SETTINGS_MODULE = config.settings

# Django's default layout puts tests in each app's tests.py, not just in a
# top-level tests/ package. Setting `testpaths` to a hand-maintained list of app
# names silently skips any app that is added later, so no testpaths is set here:
# pytest collects from the rootdir instead, and norecursedirs keeps it fast.
python_files = test_*.py tests.py
norecursedirs = .* _darcs build CVS dist node_modules venv media staticfiles

addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
