# Railway deployment config: https://docs.railway.com/reference/config-as-code
#
# Railway builds with Nixpacks (auto-detects Python from requirements.txt) and
# runs the start command below. Mirrors the Render blueprint: migrate on boot,
# then serve with gunicorn (see requirements.txt) and let WhiteNoise handle
# static files from STATIC_ROOT.

[build]
builder = "nixpacks"
buildCommand = "pip install --no-cache-dir -r requirements.txt && python manage.py collectstatic --noinput"

[deploy]
startCommand = "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
healthcheckPath = "/healthz/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
