{% comment %}
Full-screen "Now playing" surface. Opened from the bottom player bar and driven
entirely by static/js/player.js. It mirrors the transport controls of the bar
and adds a large artwork panel plus a Queue / Lyrics switch.
{% endcomment %}
<aside class="np" id="now-playing" hidden aria-label="Now playing">
  <div class="np__bar">
    <button class="np__collapse" type="button" id="np-close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Close
    </button>
    <span class="np__source" id="np-source"></span>
  </div>

  <div class="np__body">
    <div class="np__left">
      <div class="np__art">
        <img id="np-art" alt="" hidden>
        <span id="np-art-fallback" class="art art--placeholder" aria-hidden="true">♫</span>
      </div>

      <div class="np__meta">
        <div class="np__title" id="np-title">Nothing playing</div>
        <div class="np__artist" id="np-artist"></div>
      </div>

      <div class="np__transport">
        <div class="np__buttons">
          <button class="icon-btn" type="button" id="np-shuffle" aria-label="Shuffle" aria-pressed="false" title="Shuffle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5h-2V6.4l-4.3 4.3-1.4-1.4L17.6 5H16V3zm-8 0h5v2H8.8l3.3 3.3-1.4 1.4L6.9 6H8V3zm0 13H3v-2h1.1l3.3-3.3 1.4 1.4L5.8 16H8v0zm9.7-6.3L14.3 13l3.4 3.4V15H20v5h-5v-2h1.1l-3.4-3.4 1.4-1.3 3.3 3.4H19v-3h1.6l-3.4-3.4 1.5-1.3z"/></svg>
          </button>
          <button class="icon-btn" type="button" id="np-prev" aria-label="Previous track" title="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h2v12H7V6zm12 0v12l-9-6 9-6z"/></svg>
          </button>
          <button class="icon-btn icon-btn--primary" type="button" id="np-toggle" aria-label="Play" title="Play">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
          </button>
          <button class="icon-btn" type="button" id="np-next" aria-label="Next track" title="Next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6h2v12h-2V6zM5 6v12l9-6-9-6z"/></svg>
          </button>
          <button class="icon-btn" type="button" id="np-repeat" aria-label="Repeat off" aria-pressed="false" title="Repeat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            <span class="icon-btn__badge" id="np-repeat-one" hidden>1</span>
          </button>
        </div>

        <div class="np__seek">
          <span class="np__time" id="np-elapsed">0:00</span>
          <div class="seek" id="np-seek-wrap">
            <div class="seek__track">
              <div class="seek__buffer" id="np-buffer"></div>
              <div class="seek__fill" id="np-fill"></div>
            </div>
            <input type="range" class="seek__input" id="np-seek"
                   min="0" max="1000" value="0" step="1"
                   aria-label="Seek" aria-valuetext="0:00">
          </div>
          <span class="np__time" id="np-duration">0:00</span>
        </div>

        <div class="np__actions">
          <button class="icon-btn icon-btn--like" type="button" id="np-like"
                  aria-label="Favourite this track" aria-pressed="false" hidden>♥</button>
        </div>
      </div>
    </div>

    <div class="np__right">
      <div class="np__tabs" role="tablist">
        <button class="np__tab is-active" type="button" data-np-tab="queue" role="tab" aria-selected="true">Queue</button>
        <button class="np__tab" type="button" data-np-tab="lyrics" role="tab" aria-selected="false">Lyrics</button>
      </div>
      <div class="np__panels">
        <div class="np__panel" id="np-panel-queue">
          <ol class="queue__list" id="np-queue-list"></ol>
        </div>
        <div class="np__panel" id="np-panel-lyrics" hidden>
          <div class="lyrics lyrics--synced" id="np-lyrics" data-lyrics-scope></div>
        </div>
      </div>
    </div>
  </div>
</aside>
